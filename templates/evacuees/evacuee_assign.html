{% extends "base.html" %}

{% block title %}Assign Evacuee | EvacuaLink{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h1 class="h4 mb-0"><i class="bi bi-check-square"></i> Assign Evacuee</h1>
            </div>
            <div class="card-body">
                <p class="text-muted">
                    Assign <strong>{{ evacuee.full_name }}</strong> to an open evacuation center.
                </p>
                <form method="post" novalidate>
                    {% include "includes/form_fields.html" %}
                    <div class="btn-group-wrap mt-4">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg"></i> Assign Center
                        </button>
                        <a href="{% url 'evacuee-detail' evacuee.pk %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
