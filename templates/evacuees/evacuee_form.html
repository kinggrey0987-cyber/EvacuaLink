{% extends "base.html" %}
{% block title %}Evacuee Form | EvacuaLink{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if object %}Edit{% else %}Register{% endif %} Evacuee</h1>
<form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Save</button><a class="btn btn-outline-secondary" href="{% url 'evacuee-list' %}">Cancel</a></div>
</form>
{% endblock %}
