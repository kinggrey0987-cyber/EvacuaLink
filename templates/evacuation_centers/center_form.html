{% extends "base.html" %}
{% block title %}Center Form | EvacuaLink{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if object %}Edit{% else %}Add{% endif %} Evacuation Center</h1>
<form method="post" class="card card-body shadow-sm">
    {% include "includes/form_fields.html" %}
    <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{% url 'evacuation-center-list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
